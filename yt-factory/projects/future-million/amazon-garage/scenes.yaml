# Пилот Future Million. Shorts 9:16, цель 25 с.
# text  — то, что видно на экране; [в скобках] = ключевые слова (золото #FFD700)
# say   — как читает диктор (числа прописью в нужном падеже, латиница по-русски)
# hero  — крупная фоновая цифра/слово сцены (только факт из текста)
# asset — файл из assets/ (ваш клип или фото). Без него — фирменный градиент.
channel: future-million
title: "Amazon начинался в гараже"
format: short
target_seconds: 25
approved: false          # финальный рендер возможен только после «ДА» -> true

scenes:
  - id: 1
    text: "В 1994 году [Джефф Безос] ушёл с поста вице-президента на [Уолл-стрит]."
    say: "В тысяча девятьсот девяносто четвёртом году Джефф Безос ушёл с поста вице-президента на Уолл-стрит."
    hero: "1994"
    visual: "Ночной Манхэттен, окна офисных башен (нужен клип/фото)"
    transition: fade
    source: "D. E. Shaw & Co. — фирма с Уолл-стрит; Безос был вице-президентом (historyofinformation.com)"

  - id: 2
    text: "И открыл компанию в [гараже] в Белвью."
    hero: "ГАРАЖ"
    visual: "Пригородный гараж, тёплый свет лампы (нужен клип/фото)"
    transition: smoothleft
    source: "Основана 5 июля 1994, гараж в Белвью, штат Вашингтон (history.com)"

  - id: 3
    text: "Сначала она называлась [Cadabra]. Но юристу послышалось [cadaver] — «труп»."
    say: "Сначала она называлась Кадабра. Но юристу послышалось кадавер — труп."
    hero: "CADABRA"
    visual: "Старые документы о регистрации, печатная машинка (нужен клип/фото)"
    transition: fadeblack
    source: "Cadabra, Inc.; юрист услышал «cadaver» (history.com)"

  - id: 4
    text: "Название сменили — так появился [Amazon], интернет-магазин [книг]."
    say: "Название сменили — так появился Амазон, интернет-магазин книг."
    hero: "AMAZON"
    visual: "Стопки книг, картонные коробки (нужен клип/фото)"
    transition: smoothup
    source: "Переименование через несколько месяцев; продажа книг онлайн (history.com)"

  - id: 5
    text: "В 1997 году акции вышли на биржу по [18 долларов]."
    say: "В тысяча девятьсот девяносто седьмом году акции вышли на биржу по восемнадцать долларов."
    hero: "$18"
    visual: "Биржевое табло NASDAQ, бегущие котировки (нужен клип/фото)"
    transition: fade
    source: "IPO 15 мая 1997, $18 за акцию, NASDAQ: AMZN (CNN Money, 15.05.1997)"

  - id: 6
    text: "После четырёх сплитов одна такая акция превратилась в [240]."
    say: "После четырёх сплитов одна такая акция превратилась в двести сорок."
    hero: "×240"
    visual: "График роста, одна акция дробится на много (моушн-графика)"
    transition: zoomin
    source: "4 сплита: 2:1 (1998), 3:1 (1999), 2:1 (1999), 20:1 (2022) = ×240 (The Motley Fool)"

  - id: 7
    text: "Всё началось с [гаража]."
    visual: "Возврат к гаражу, медленный отъезд камеры (нужен клип/фото)"
    transition: fadeblack

sources:
  - "https://www.history.com/this-day-in-history/july-5/amazon-is-founded-by-jeff-bezos"
  - "https://historyofinformation.com/detail.php?entryid=1337"
  - "https://money.cnn.com/1997/05/15/markets/stockswatch/index.htm"
  - "https://www.fool.com/investing/2025/02/20/if-you-bought-1-share-of-amazon-at-its-ipo"
